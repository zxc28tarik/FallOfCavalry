<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sprite Preview</title>
<style>
  body { background: #1a1a22; margin: 0; padding: 20px; font-family: monospace; color: #ccc; }
  h1 { color: #d4a94c; font-size: 16px; margin-bottom: 12px; }
  canvas { display: block; border: 1px solid #333; }
  .label { font-size: 10px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h1>FallOfCavalry — Sprite Preview (HoMM3 style)</h1>
<canvas id="c" width="1080" height="400"></canvas>
<script type="module">
import SpriteGenerator from '/js/rendering/sprite-generator.js';

const sg = new SpriteGenerator();
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

ctx.fillStyle = '#1a1a22';
ctx.fillRect(0, 0, canvas.width, canvas.height);

const units = [
  { faction: 'ottoman', type: 'pike_inf' },
  { faction: 'ottoman', type: 'archer' },
  { faction: 'ottoman', type: 'cav_archer' },
  { faction: 'hre',     type: 'pike_inf' },
  { faction: 'hre',     type: 'musketeer' },
  { faction: 'hre',     type: 'heavy_cav' },
  { faction: 'polish',  type: 'cav_pike' },
  { faction: 'spanish', type: 'musketeer' },
  { faction: 'spanish', type: 'carbine_cav' },
  { faction: 'bandit',  type: 'archer' },
  { faction: 'venice',  type: 'pike_inf' },
  { faction: 'free_company', type: 'heavy_cav' },
];

const cols = 6;
const cellW = canvas.width / cols;
const cellH = 190;

units.forEach((u, i) => {
  const col = i % cols;
  const row = Math.floor(i / cols);
  const cx = col * cellW + cellW / 2;
  const cy = row * cellH + 100;

  // Background cell
  ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.1)';
  ctx.fillRect(col * cellW, row * cellH, cellW, cellH);

  // Shadow ellipse
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 42, 22, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  const sprite = sg.getUnitSprite(u.faction, u.type, i + 1);
  if (sprite) {
    ctx.drawImage(sprite, cx - 40, cy - 40, 80, 80);
  } else {
    ctx.fillStyle = 'red';
    ctx.fillText('ERR', cx, cy);
  }

  ctx.fillStyle = '#d4a94c';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(u.faction.toUpperCase(), cx, cy + 58);
  ctx.fillStyle = '#999';
  ctx.font = '9px monospace';
  ctx.fillText(u.type, cx, cy + 70);
});

// Grid lines
ctx.strokeStyle = 'rgba(255,255,255,0.06)';
ctx.lineWidth = 1;
for (let c = 1; c < cols; c++) {
  ctx.beginPath();
  ctx.moveTo(c * cellW, 0);
  ctx.lineTo(c * cellW, canvas.height);
  ctx.stroke();
}
ctx.beginPath();
ctx.moveTo(0, cellH);
ctx.lineTo(canvas.width, cellH);
ctx.stroke();
</script>
</body>
</html>
