name: Web validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static checks, unit/full tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout web source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Static checks, unit tests and production build
        run: npm run validate

      - name: Complete Vitest suite (including battle and manager tests)
        run: npm run test
