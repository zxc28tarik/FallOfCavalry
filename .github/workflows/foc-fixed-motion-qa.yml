name: FOC fixed mesh and motion structure
on:
  push:
    paths:
      - 'FOC-Visual-Sandbox/FallOfCavalry_PLAYABLE_RTS.html'
      - 'scripts/qa-fixed-mesh-animation.mjs'
      - '.github/workflows/foc-fixed-motion-qa.yml'
  pull_request:
    paths:
      - 'FOC-Visual-Sandbox/FallOfCavalry_PLAYABLE_RTS.html'
      - 'scripts/qa-fixed-mesh-animation.mjs'
      - '.github/workflows/foc-fixed-motion-qa.yml'
jobs:
  fixed-archetype-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fixed mesh geometry and animation transforms
        run: node scripts/qa-fixed-mesh-animation.mjs
